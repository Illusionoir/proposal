<!DOCTYPE html>
<html lang="en">
  <head>

    <title>Love Proposal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="hearts" aria-hidden="true">
      <span>❤</span>

    <script src="script.js"></script>
